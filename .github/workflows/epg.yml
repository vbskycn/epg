name: EPG

on:
  schedule:
    - cron: 0 4,10,22 * * *
    - cron: 39 15,16 * * *
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - url: https://epg.112114.xyz/pp.xml.gz
            branch: 112114
            sleep: 0s
          - url: https://e.erw.cc/e.xml.gz
            branch: erw
            sleep: 30s
          #- url: http://epg.51zmt.top:8000/e.xml
          #  branch: 51zmt
          #  sleep: 60s

    steps:
      - name: download files
        run: |
          wget https://raw.githubusercontent.com/${{ github.repository }}/${{ matrix.branch }}/md5.txt -O md5.txt
          url="${{ matrix.url }}"
          if [[ "$url" == *".gz" ]]; then
            echo "url is end with gz"
            wget $url -O e.xml.gz
            gzip -df e.xml.gz
          else
            echo "url is not end with gz"
            wget $url -O e.xml
          fi

      - name: check md5
        run: |
          md5=$(md5sum ./e.xml | awk '{print $1}')
          if ! grep -q "$md5" ./md5.txt; then
            echo "isDiff=$md5" >> $GITHUB_ENV
            now_time=$(date -u -d '+8 hour' '+%Y-%m-%d %H:%M:%S')
            echo "now_time=$now_time" >> $GITHUB_ENV
            tag=$(date -u -d '+8 hour' '+%Y.%m.%d')
            echo "tag=$tag" >> $GITHUB_ENV
            echo "has_updates=true" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi

      - name: checkout code
        uses: actions/checkout@v4
        if: ${{ env.isDiff }}
        with:
          ref: ${{ matrix.branch }}
          path: epg

      - uses: actions/setup-python@v5
        if: ${{ env.isDiff }}
        with:
          python-version: '3.12' 

      - name: xml to json
        if: ${{ env.isDiff }}
        working-directory: epg
        run: |
          mkdir ./xml ./json
          mv -f ../e.xml ./xml/e.xml
          pip install -r requirements.txt
          python xml2json.py

      - name: move file
        if: ${{ env.isDiff }}
        working-directory: epg
        run: |
          now_date=$(date -u -d '+8 hour' '+%Y-%m-%d')
          mv -f ./xml/e.xml ./xml/${{ matrix.branch }}.xml
          mv -f ./json/e.json ./json/${{ matrix.branch }}.json
          echo "${{ env.isDiff }}" > ./md5.txt
          sleep ${{ matrix.sleep }}

      - uses: ncipollo/release-action@v1
        if: ${{ env.isDiff }}
        with:
          tag: ${{ env.tag }}
          body: "更新时间: ${{ env.now_time }}"
          allowUpdates: true
          artifacts: |
            epg/xml/*.xml
            epg/json/*.json

      - name: Commit
        if: ${{ env.isDiff }}
        working-directory: epg
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          sed "2c * 更新时间: ${{ env.now_time }}" README.md -i
          rm -rf ./xml
          rm -rf ./json
          git add --all
          git commit -m "${{ env.now_time }}"
          git push -f origin ${{ matrix.branch }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
    
    steps:
      - name: Checkout 112114 branch
        uses: actions/checkout@v4
        with:
          ref: 112114
        
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq wget
        
      - name: Check for updates
        id: check_updates
        run: |
          # 检查是否有新的releases
          latest_tag=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.tag_name')
          if [ "$latest_tag" != "null" ] && [ "$latest_tag" != "" ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "latest_tag=$latest_tag" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi
        
      - name: Prepare static files
        if: steps.check_updates.outputs.has_updates == 'true'
        run: |
          # 创建gh-pages目录
          mkdir -p gh-pages
          
          # 复制logo目录
          cp -r logo gh-pages/
          
          # 创建XML和JSON目录
          mkdir -p gh-pages/xml gh-pages/json
          
          # 从releases下载最新的XML和JSON文件
          latest_tag=${{ steps.check_updates.outputs.latest_tag }}
          if [ "$latest_tag" != "null" ] && [ "$latest_tag" != "" ]; then
            # 下载112114分支的文件
            wget -O gh-pages/xml/112114.xml "https://github.com/${{ github.repository }}/releases/download/$latest_tag/112114.xml" || echo "Failed to download 112114.xml"
            wget -O gh-pages/json/112114.json "https://github.com/${{ github.repository }}/releases/download/$latest_tag/112114.json" || echo "Failed to download 112114.json"
            # 下载erw分支的文件
            wget -O gh-pages/xml/erw.xml "https://github.com/${{ github.repository }}/releases/download/$latest_tag/erw.xml" || echo "Failed to download erw.xml"
            wget -O gh-pages/json/erw.json "https://github.com/${{ github.repository }}/releases/download/$latest_tag/erw.json" || echo "Failed to download erw.json"
          fi
          
          # 创建简单的HTML索引页面
          cat > gh-pages/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>EPG 节目表</title>
              <style>
                  body { font-family: Arial, sans-serif; margin: 40px; }
                  .container { max-width: 800px; margin: 0 auto; }
                  .logo { text-align: center; margin: 20px 0; }
                  .logo img { max-width: 200px; height: auto; }
                  .section { margin: 30px 0; }
                  .section h2 { color: #333; border-bottom: 2px solid #eee; padding-bottom: 10px; }
                  .section p { line-height: 1.6; }
                  .update-time { color: #666; font-size: 14px; }
              </style>
          </head>
          <body>
              <div class="container">
                  <div class="logo">
                      <h1>EPG 节目表</h1>
                      <p class="update-time">自动更新于: ${{ env.now_time || '未知' }}</p>
                  </div>
                  
                  <div class="section">
                      <h2>关于本项目</h2>
                      <p>这是一个EPG（电子节目指南）数据项目，提供电视节目的时间表信息。</p>
                      <p>数据来源：<a href="https://github.com/sparkssssssssss/epg" target="_blank">sparks/epg</a></p>
                      <p>本项目将2024年2月14日（含）以后的数据备份，并提供静态文件访问。</p>
                  </div>
                  
                  <div class="section">
                      <h2>数据文件</h2>
                      <p>EPG数据以XML和JSON格式提供，可通过以下方式访问：</p>
                      <ul>
                          <li><strong>XML格式</strong>：适用于传统EPG客户端</li>
                          <li><strong>JSON格式</strong>：适用于现代Web应用和移动端</li>
                      </ul>
                  </div>
                  
                  <div class="section">
                      <h2>频道图标</h2>
                      <p>logo目录包含各频道的图标文件，可用于EPG客户端的美化显示。</p>
                  </div>
                  
                  <div class="section">
                      <h2>使用说明</h2>
                      <p>如需获取特定频道和日期的节目信息，请参考项目README中的API使用说明。</p>
                      <p>项目地址：<a href="https://github.com/${{ github.repository }}" target="_blank">GitHub Repository</a></p>
                  </div>
              </div>
          </body>
          </html>
          EOF
          
      - name: Deploy to gh-pages branch
        if: steps.check_updates.outputs.has_updates == 'true'
        run: |
          # 配置Git用户信息
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # 强制删除gh-pages分支（如果存在）
          git push origin --delete gh-pages || echo "Branch gh-pages does not exist or already deleted"
          
          # 等待一下确保删除操作完成
          sleep 2
          
          # 创建新的gh-pages分支
          git checkout -b gh-pages
          
          # 清空所有文件（保留.git目录）
          find . -mindepth 1 -not -path './.git*' -not -path './gh-pages*' -delete
          
          # 复制新文件到当前目录
          cp -r gh-pages/* .
          
          # 添加所有文件
          git add --all
          
          # 强制提交（覆盖历史）
          git commit -m "Complete rebuild of EPG static files - ${{ steps.check_updates.outputs.latest_tag }}"
          
          # 强制推送到gh-pages分支
          git push origin gh-pages --force
