name: EPG

on:
  schedule:
    - cron: 0 4,10,22 * * *
    - cron: 39 15,16 * * *
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - url: https://epg.112114.xyz/pp.xml.gz
            branch: 112114
            sleep: 0s
          - url: https://e.erw.cc/e.xml.gz
            branch: erw
            sleep: 30s
          #- url: http://epg.51zmt.top:8000/e.xml
          #  branch: 51zmt
          #  sleep: 60s

    steps:
      - name: download files
        run: |
          wget https://raw.githubusercontent.com/${{ github.repository }}/${{ matrix.branch }}/md5.txt -O md5.txt
          url="${{ matrix.url }}"
          if [[ "$url" == *".gz" ]]; then
            echo "url is end with gz"
            wget $url -O e.xml.gz
            gzip -df e.xml.gz
          else
            echo "url is not end with gz"
            wget $url -O e.xml
          fi

      - name: check md5
        run: |
          md5=$(md5sum ./e.xml | awk '{print $1}')
          if ! grep -q "$md5" ./md5.txt; then
            echo "isDiff=$md5" >> $GITHUB_ENV
            now_time=$(date -u -d '+8 hour' '+%Y-%m-%d %H:%M:%S')
            echo "now_time=$now_time" >> $GITHUB_ENV
            tag=$(date -u -d '+8 hour' '+%Y.%m.%d')
            echo "tag=$tag" >> $GITHUB_ENV
            echo "has_updates=true" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi

      - name: checkout code
        uses: actions/checkout@v4
        if: ${{ env.isDiff }}
        with:
          ref: ${{ matrix.branch }}
          path: epg

      - uses: actions/setup-python@v5
        if: ${{ env.isDiff }}
        with:
          python-version: '3.12' 

      - name: xml to json
        if: ${{ env.isDiff }}
        working-directory: epg
        run: |
          mkdir ./xml ./json
          mv -f ../e.xml ./xml/e.xml
          pip install -r requirements.txt
          python xml2json.py

      - name: move file
        if: ${{ env.isDiff }}
        working-directory: epg
        run: |
          now_date=$(date -u -d '+8 hour' '+%Y-%m-%d')
          mv -f ./xml/e.xml ./xml/${{ matrix.branch }}.xml
          mv -f ./json/e.json ./json/${{ matrix.branch }}.json
          echo "${{ env.isDiff }}" > ./md5.txt
          sleep ${{ matrix.sleep }}

      - uses: ncipollo/release-action@v1
        if: ${{ env.isDiff }}
        with:
          tag: ${{ env.tag }}
          body: "更新时间: ${{ env.now_time }}"
          allowUpdates: true
          artifacts: |
            epg/xml/*.xml
            epg/json/*.json

      - name: Commit
        if: ${{ env.isDiff }}
        working-directory: epg
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          sed "2c * 更新时间: ${{ env.now_time }}" README.md -i
          rm -rf ./xml
          rm -rf ./json
          git add --all
          git commit -m "${{ env.now_time }}"
          git push -f origin ${{ matrix.branch }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
    
    steps:
      - name: Checkout 112114 branch
        uses: actions/checkout@v4
        with:
          ref: 112114
        
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq wget
        
      - name: Check for updates
        id: check_updates
        run: |
          # 检查是否有新的releases
          latest_tag=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.tag_name')
          if [ "$latest_tag" != "null" ] && [ "$latest_tag" != "" ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "latest_tag=$latest_tag" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi
        
      - name: Prepare static files
        if: steps.check_updates.outputs.has_updates == 'true'
        run: |
          # 创建gh-pages目录
          mkdir -p gh-pages
          
          # 复制logo目录
          cp -r logo gh-pages/
          
          # 创建XML和JSON目录
          mkdir -p gh-pages/xml gh-pages/json
          
          # 从releases下载最新的XML和JSON文件
          latest_tag=${{ steps.check_updates.outputs.latest_tag }}
          if [ "$latest_tag" != "null" ] && [ "$latest_tag" != "" ]; then
            # 下载112114分支的文件
            wget -O gh-pages/xml/112114.xml "https://github.com/${{ github.repository }}/releases/download/$latest_tag/112114.xml" || echo "Failed to download 112114.xml"
            wget -O gh-pages/json/112114.json "https://github.com/${{ github.repository }}/releases/download/$latest_tag/112114.json" || echo "Failed to download 112114.json"
            # 下载erw分支的文件
            wget -O gh-pages/xml/erw.xml "https://github.com/${{ github.repository }}/releases/download/$latest_tag/erw.xml" || echo "Failed to download erw.xml"
            wget -O gh-pages/json/erw.json "https://github.com/${{ github.repository }}/releases/download/$latest_tag/erw.json" || echo "Failed to download erw.json"
          fi
          
          # 创建根目录XML文件（软件访问根目录时自动加载）
          cp gh-pages/xml/112114.xml gh-pages/index.xml
          
          # 创建智能根目录入口，完全兼容原workers逻辑
          cat > gh-pages/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <title>EPG API</title>
          </head>
          <body>
          <script>
          // EPG API - 完全兼容原Cloudflare Workers
          const Config = {
              repository: '${{ github.repository }}',
              branch: '112114'
          };

          function getNowDate() {
              const utc_timestamp = (new Date()).getTime();
              const china_time = new Date(utc_timestamp + 8 * 60 * 60 * 1000);
              const month = china_time.getMonth() + 1;
              const day = china_time.getDate();
              return `${china_time.getFullYear()}-${month < 10 ? '0' + month : month}-${day < 10 ? '0' + day : day}`;
          }

          function getFormatTime(time) {
              let result = {
                  date: '',
                  time: ''
              };

              if (time.length < 8) {
                  result['date'] = getNowDate();
                  return result;
              }

              let year = time.substring(0, 4);
              let month = time.substring(4, 6);
              let day = time.substring(6, 8);
              result['date'] = year + '-' + month + '-' + day;

              if (time.length >= 12) {
                  let hour = time.substring(8, 10);
                  let minute = time.substring(10, 12);
                  result['time'] = hour + ':' + minute;
              }
              return result;
          }

          async function diypHandle(channel, date) {
              try {
                  const response = await fetch('./json/112114.json');
                  const data = await response.json();

                  const program_info = {
                      "date": date,
                      "channel_name": channel,
                      "url": `https://github.com/${Config.repository}`,
                      "epg_data": []
                  };

                  data.forEach(function (element) {
                      if (element['@channel'] === channel && element['@start'].startsWith(date.replaceAll('-', ''))) {
                          program_info['epg_data'].push({
                              "start": getFormatTime(element['@start'])['time'],
                              "end": getFormatTime(element['@stop'])['time'],
                              "title": element['title']['#text'],
                              "desc": (element['desc'] && element['desc']['#text']) ? element['desc']['#text'] : ''
                          });
                      }
                  });

                  if (program_info['epg_data'].length === 0) {
                      program_info['epg_data'].push({
                          "start": "00:00",
                          "end": "23:59",
                          "title": "未知节目",
                          "desc": ""
                      });
                  }
                  return program_info;
              } catch (error) {
                  return {
                      "date": date,
                      "channel_name": channel,
                      "url": `https://github.com/${Config.repository}`,
                      "epg_data": [{
                          "start": "00:00",
                          "end": "23:59",
                          "title": "未知节目",
                          "desc": ""
                      }]
                  };
              }
          }

          // 处理请求，完全兼容原workers逻辑
          async function handleRequest() {
              const url = new URL(window.location.href);
              const channel = url.searchParams.get("ch");
              
              if (!channel || channel.length === 0) {
                  // 无ch参数，返回XML格式（兼容原workers逻辑）
                  try {
                      const response = await fetch('./xml/112114.xml');
                      const xmlText = await response.text();
                      
                      // 设置XML内容类型
                      document.contentType = 'text/xml';
                      
                      // 如果是软件请求，直接返回XML内容
                      if (navigator.userAgent.includes('Diyp') || navigator.userAgent.includes('百川') || 
                          navigator.userAgent.includes('EPG') || navigator.userAgent.includes('TV')) {
                          // 软件请求，直接显示XML内容
                          document.body.innerHTML = xmlText;
                      } else {
                          // 浏览器请求，显示信息页面
                          document.body.innerHTML = '<h1>EPG API</h1><p>XML格式EPG数据已加载</p><pre>' + xmlText.substring(0, 500) + '...</pre>';
                      }
                  } catch (error) {
                      document.body.innerHTML = 'XML file not found';
                  }
                  return;
              }

              // 有ch参数，返回JSON格式（兼容原workers逻辑）
              let date = url.searchParams.get("date");
              if (date) {
                  date = getFormatTime(date.replace(/\D+/g, ''))['date'];
              } else {
                  date = getNowDate();
              }

              const channelUpper = channel.replaceAll('-', '').toUpperCase();
              if (parseInt(date.replaceAll('-', '')) >= 20240214) {
                  const result = await diypHandle(channelUpper, date);
                  
                  // 设置JSON内容类型
                  document.contentType = 'application/json';
                  
                  // 如果是软件请求，直接返回JSON内容
                  if (navigator.userAgent.includes('Diyp') || navigator.userAgent.includes('百川') || 
                      navigator.userAgent.includes('EPG') || navigator.userAgent.includes('TV')) {
                      document.body.innerHTML = JSON.stringify(result);
                  } else {
                      document.body.innerHTML = '<h1>EPG API</h1><p>JSON格式EPG数据已加载</p><pre>' + JSON.stringify(result, null, 2) + '</pre>';
                  }
              } else {
                  const result = {
                      "date": date,
                      "channel_name": channelUpper,
                      "url": `https://github.com/${Config.repository}`,
                      "epg_data": [{
                          "start": "00:00",
                          "end": "23:59",
                          "title": "未知节目",
                          "desc": ""
                      }]
                  };
                  
                  // 设置JSON内容类型
                  document.contentType = 'application/json';
                  
                  // 如果是软件请求，直接返回JSON内容
                  if (navigator.userAgent.includes('Diyp') || navigator.userAgent.includes('百川') || 
                      navigator.userAgent.includes('EPG') || navigator.userAgent.includes('TV')) {
                      document.body.innerHTML = JSON.stringify(result);
                  } else {
                      document.body.innerHTML = '<h1>EPG API</h1><p>JSON格式EPG数据已加载</p><pre>' + JSON.stringify(result, null, 2) + '</pre>';
                  }
              }
          }

          // 页面加载时自动处理
          if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', handleRequest);
          } else {
              handleRequest();
          }
          </script>
          </body>
          </html>
          EOF
          
          # 创建简单的README文件
          cat > gh-pages/README.md << 'EOF'
          # EPG 节目表静态文件
          
          这是一个EPG（电子节目指南）数据项目，提供电视节目的时间表信息。
          
          ## 文件结构
          
          - `index.html` - 智能根目录入口，完全兼容原Cloudflare Workers逻辑
          - `index.xml` - 备用XML文件
          - `xml/112114.xml` - 完整的XML格式EPG数据
          - `json/112114.json` - 完整的JSON格式EPG数据  
          - `logo/` - 频道图标文件
          
          ## 使用方法
          
          ### 完全兼容原Workers接口
          
          **XML格式（传统EPG客户端）**：
          - 访问根目录：`https://your-domain.com/`
          - 无查询参数
          - 自动返回XML格式EPG数据
          
          **JSON格式（现代软件）**：
          - 访问：`https://your-domain.com/?ch=频道名`
          - 示例：`https://your-domain.com/?ch=CCTV1`
          - 特定日期：`https://your-domain.com/?ch=CCTV1&date=2024-02-14`
          
          ## 软件配置说明
          
          **Diyp & 百川等软件配置**：
          - EPG服务器地址：`https://your-domain.com`
          - 软件会自动访问根目录获得XML数据
          - 或者通过查询参数获得特定频道的JSON数据
          
          ## 数据来源
          
          数据来自 [sparks/epg](https://github.com/sparkssssssssss/epg)
          EOF
          
      - name: Deploy to gh-pages branch
        if: steps.check_updates.outputs.has_updates == 'true'
        run: |
          # 配置Git用户信息
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # 强制删除gh-pages分支（如果存在）
          git push origin --delete gh-pages || echo "Branch gh-pages does not exist or already deleted"
          
          # 等待一下确保删除操作完成
          sleep 2
          
          # 创建新的gh-pages分支
          git checkout -b gh-pages
          
          # 清空所有文件（保留.git目录）
          find . -mindepth 1 -not -path './.git*' -not -path './gh-pages*' -delete
          
          # 复制新文件到当前目录
          cp -r gh-pages/* .
          
          # 添加所有文件
          git add --all
          
          # 强制提交（覆盖历史）
          git commit -m "Complete rebuild of EPG static files - ${{ steps.check_updates.outputs.latest_tag }}"
          
          # 强制推送到gh-pages分支
          git push origin gh-pages --force
