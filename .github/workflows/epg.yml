name: EPG

on:
  schedule:
    - cron: 0 4,10,22 * * *
    - cron: 39 15,16 * * *
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - url: https://epg.112114.xyz/pp.xml.gz
            branch: 112114
            sleep: 0s
          - url: https://e.erw.cc/e.xml.gz
            branch: erw
            sleep: 30s
          #- url: http://epg.51zmt.top:8000/e.xml
          #  branch: 51zmt
          #  sleep: 60s

    steps:
      - name: download files
        run: |
          wget https://raw.githubusercontent.com/${{ github.repository }}/${{ matrix.branch }}/md5.txt -O md5.txt
          url="${{ matrix.url }}"
          if [[ "$url" == *".gz" ]]; then
            echo "url is end with gz"
            wget $url -O e.xml.gz
            gzip -df e.xml.gz
          else
            echo "url is not end with gz"
            wget $url -O e.xml
          fi

      - name: check md5
        run: |
          md5=$(md5sum ./e.xml | awk '{print $1}')
          if ! grep -q "$md5" ./md5.txt; then
            echo "isDiff=$md5" >> $GITHUB_ENV
            now_time=$(date -u -d '+8 hour' '+%Y-%m-%d %H:%M:%S')
            echo "now_time=$now_time" >> $GITHUB_ENV
            tag=$(date -u -d '+8 hour' '+%Y.%m.%d')
            echo "tag=$tag" >> $GITHUB_ENV
            echo "has_updates=true" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi

      - name: checkout code
        uses: actions/checkout@v4
        if: ${{ env.isDiff }}
        with:
          ref: ${{ matrix.branch }}
          path: epg

      - uses: actions/setup-python@v5
        if: ${{ env.isDiff }}
        with:
          python-version: '3.12' 

      - name: xml to json
        if: ${{ env.isDiff }}
        working-directory: epg
        run: |
          mkdir ./xml ./json
          mv -f ../e.xml ./xml/e.xml
          pip install -r requirements.txt
          python xml2json.py

      - name: move file
        if: ${{ env.isDiff }}
        working-directory: epg
        run: |
          now_date=$(date -u -d '+8 hour' '+%Y-%m-%d')
          mv -f ./xml/e.xml ./xml/${{ matrix.branch }}.xml
          mv -f ./json/e.json ./json/${{ matrix.branch }}.json
          echo "${{ env.isDiff }}" > ./md5.txt
          sleep ${{ matrix.sleep }}

      - uses: ncipollo/release-action@v1
        if: ${{ env.isDiff }}
        with:
          tag: ${{ env.tag }}
          body: "更新时间: ${{ env.now_time }}"
          allowUpdates: true
          artifacts: |
            epg/xml/*.xml
            epg/json/*.json

      - name: Commit
        if: ${{ env.isDiff }}
        working-directory: epg
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          sed "2c * 更新时间: ${{ env.now_time }}" README.md -i
          rm -rf ./xml
          rm -rf ./json
          git add --all
          git commit -m "${{ env.now_time }}"
          git push -f origin ${{ matrix.branch }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
    
    steps:
      - name: Checkout 112114 branch
        uses: actions/checkout@v4
        with:
          ref: 112114
        
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq wget
        
      - name: Check for updates
        id: check_updates
        run: |
          # 检查是否有新的releases
          latest_tag=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.tag_name')
          if [ "$latest_tag" != "null" ] && [ "$latest_tag" != "" ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "latest_tag=$latest_tag" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi
        
      - name: Prepare static files
        if: steps.check_updates.outputs.has_updates == 'true'
        run: |
          # 复制edgeone.json到工作目录
          cp edgeone.json gh-pages/ || echo "edgeone.json copied to gh-pages/"
          
          # 创建gh-pages目录
          mkdir -p gh-pages
          
          # 复制logo目录
          cp -r logo gh-pages/
          
          # 创建XML和JSON目录
          mkdir -p gh-pages/xml gh-pages/json
          
          # 从releases下载最新的XML和JSON文件
          latest_tag=${{ steps.check_updates.outputs.latest_tag }}
          if [ "$latest_tag" != "null" ] && [ "$latest_tag" != "" ]; then
            # 下载112114分支的文件
            wget -O gh-pages/xml/112114.xml "https://github.com/${{ github.repository }}/releases/download/$latest_tag/112114.xml" || echo "Failed to download 112114.xml"
            wget -O gh-pages/json/112114.json "https://github.com/${{ github.repository }}/releases/download/$latest_tag/112114.json" || echo "Failed to download 112114.json"
            # 下载erw分支的文件
            wget -O gh-pages/xml/erw.xml "https://github.com/${{ github.repository }}/releases/download/$latest_tag/erw.xml" || echo "Failed to download erw.xml"
            wget -O gh-pages/json/erw.json "https://github.com/${{ github.repository }}/releases/download/$latest_tag/erw.json" || echo "Failed to download erw.json"
          fi
          
          # 创建根目录XML文件，软件访问根目录时直接获得XML数据
          cp gh-pages/xml/112114.xml gh-pages/index.xml
          
          # 为XML文件添加正确的XML标头
          sed -i '1i<?xml version="1.0" encoding="UTF-8"?>' gh-pages/index.xml
          

          
          # 创建说明文件
          cat > gh-pages/README.md << 'EOF'
          # EPG 节目表静态文件
          
          这是一个EPG（电子节目指南）数据项目，提供电视节目的时间表信息。
          
          ## 文件结构
          
          - `index.xml` - 根目录XML文件，软件访问根目录时直接获得XML数据
          - `xml/112114.xml` - 完整的XML格式EPG数据
          - `json/112114.json` - 完整的JSON格式EPG数据  
          - `logo/` - 频道图标文件
          
          ## 使用方法
          
          ### XML格式（传统EPG客户端）
          - 访问根目录：`https://your-domain.com/` 或 `https://your-domain.com/index.xml`
          - 直接返回XML格式EPG数据，无多余字符
          - 自动设置正确的Content-Type: text/xml
          
          ### JSON格式（完整数据）
          - 访问：`https://your-domain.com/json/112114.json`
          - 返回完整的JSON格式EPG数据
          - 自动设置正确的Content-Type: application/json
          
          ## 软件配置说明
          
          **Diyp & 百川等软件配置**：
          - EPG服务器地址：`https://your-domain.com`
          - 软件访问根目录时直接获得纯XML数据
          - 无HTML包装，无多余字符
          - 自动识别为XML格式
          
          ## 腾讯Pages配置
          
          `edgeone.json` 文件配置了：
          - 首页文件：`index.xml`
          - 自动设置正确的Content-Type头
          - 路由规则确保文件正确访问
          
          ## 数据来源
          
          数据来自 [sparks/epg](https://github.com/sparkssssssssss/epg)
          EOF
          
      - name: Deploy to gh-pages branch
        if: steps.check_updates.outputs.has_updates == 'true'
        run: |
          # 配置Git用户信息
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # 强制删除gh-pages分支（如果存在）
          git push origin --delete gh-pages || echo "Branch gh-pages does not exist or already deleted"
          
          # 等待一下确保删除操作完成
          sleep 2
          
          # 创建新的gh-pages分支
          git checkout -b gh-pages
          
          # 完全清空当前目录（只保留.git目录）
          git rm -rf . || true
          git clean -fxd || true
          
          # 复制新文件到当前目录（不复制gh-pages目录本身）
          cp -r gh-pages/* . 2>/dev/null || true
          
          # 确保没有重复的gh-pages目录
          rm -rf gh-pages
          
          # 添加所有文件
          git add --all
          
          # 强制提交（覆盖历史）
          git commit -m "Complete rebuild of EPG static files - ${{ steps.check_updates.outputs.latest_tag }}"
          
          # 强制推送到gh-pages分支
          git push origin gh-pages --force